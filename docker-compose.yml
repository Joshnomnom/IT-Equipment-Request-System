services:
  db:
    image: postgres:16-alpine
    container_name: it-equipment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: it_equipment
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d it_equipment']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
